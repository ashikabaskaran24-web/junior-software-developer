<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="show()">show</button>
    <script type="text/javascript">
        function show()
        {
            var arr=[[11,12,13],[21,22,23],[31,32,33]]
            for(var i=0;i<3;i++)
            {
              for(var j=0;j<3;j++)
              {
                document.write(arr[i][j]+" ")
              }
              document.write("<br>")

           }
        }
    </script>
</body>
</html>
