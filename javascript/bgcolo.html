<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function colors()
        {
             document.bgColor=event.target.value;
        }
    </script>
</head>
<body>
    <h1><center>change background color</center></h1>
                               <label>select color:</label>
                               <input type="radio"onchange="colors()" name="col" value="red">red
                               <input type="radio"onchange="colors()" name="col" value="yellow">yellow
                               <input type="radio"onchange="colors()" name="col" value="green">green
</body>
</html>
