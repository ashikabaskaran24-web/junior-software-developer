<body>
    <input type="text"id="t1">
    <br>
     <input type="text"id="t2">

     <input type="button"value="continue test"onclick="show()">
     <p id="ans"></p>
     <script type="text/javascript">
        function show()
         {
          var n1=parseInt(document.getElementById("t1").value);
          var n2=parseInt(document.getElementById("t2").value);
          var res="";
            for(var i=n1;i<=n2;i++)
          {
              if(i<=20)
              continue;
            res=res+i+" ";
          }
          var n3=document.getElementById("ans").innerHTML="result"+"="+res
         }
     </script>
