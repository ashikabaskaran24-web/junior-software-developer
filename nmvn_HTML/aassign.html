<!DOCTYPE html>
<html>
<head>
    <title>Column Grid</title>

    <style>
        #grid {
            display: grid;
            gap: 10px;
        }

        .box {
            background: lightblue;
            padding: 30px;
        }
    </style>
</head>

<body>

<h1>Column Grid</h1>

<input type="number" id="n" value="3">

<button onclick="set()">Set</button>
<button onclick="add()">+</button>
<button onclick="remove()">-</button>

<br><br>

<input type="number" id="from" placeholder="From">
<input type="number" id="to" placeholder="To">

<button onclick="move()">Move</button>

<div id="grid"></div>


<script>

let a = ["Column 1", "Column 2", "Column 3"];

function show()
{
    let g = document.getElementById("grid");

    g.innerHTML = "";

    g.style.gridTemplateColumns =
        "repeat(" + a.length + ",1fr)";

    for(let i=0; i<a.length; i++)
    {
        g.innerHTML +=
            "<div class='box'>" +
            a[i] +
            "<br>Index : " + (i+1) +
            "</div>";
    }
}


function set()
{
    let n = Number(document.getElementById("n").value);

    while(a.length < n)
    {
        a.push("Column " + (a.length+1));
    }

    while(a.length > n)
    {
        a.pop();
    }

    show();
}


function add()
{
    a.push("Column " + (a.length+1));

    document.getElementById("n").value = a.length;

    show();
}


function remove()
{
    if(a.length > 1)
    {
        a.pop();
    }

    document.getElementById("n").value = a.length;

    show();
}


function move()
{
    let from = Number(document.getElementById("from").value);
    let to = Number(document.getElementById("to").value);

    let x = a[from-1];

    a.splice(from-1,1);

    a.splice(to-1,0,x);

    show();
}


show();

</script>

</body>
</html>
